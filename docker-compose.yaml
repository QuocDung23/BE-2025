version: "3.9"

services:
  trip-database:
    image: postgres:15
    container_name: trip-database
    restart: on-failure
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: trip
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  trip-backend:
    build: .
    container_name: trip-backend
    depends_on:
      - trip-database
    environment:
      DATABASE_URL: postgres://root:123@trip-database:5432/trip
    ports:
      - "3000:3000"
    restart: on-failure

volumes:
  db_data:
